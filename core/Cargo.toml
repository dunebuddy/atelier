[package]
name = "atelier-core"
version = "0.2.22"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.32", features = ["bundled", "hooks"] }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs", "process", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["cors"] }
dirs = "6"
toml = "0.8"
toml_edit = "0.22"
portable-pty = "0.9"
base64 = "0.22"
mime_guess = "2"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rust_xlsxwriter = "0.79"
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }
getrandom = "0.2"

[target.'cfg(windows)'.dependencies]
# terminal que mata a árvore inteira (Job Object) e iniciar com o sistema (chave Run); a mesma versão do Tauri
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Registry", "Win32_Security"] }

# a chave do cofre de segredos fica no cofre do sistema: Credential Manager (DPAPI) no Windows, Secret Service no Linux
[target.'cfg(windows)'.dependencies.keyring]
version = "3"
features = ["windows-native"]

[target.'cfg(target_os = "linux")'.dependencies.keyring]
version = "3"
features = ["async-secret-service", "async-io", "crypto-rust"]

[target.'cfg(target_os = "macos")'.dependencies.keyring]
version = "3"
features = ["apple-native"]
