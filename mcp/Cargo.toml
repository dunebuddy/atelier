[package]
name = "atelier-mcp"
version = "0.2.5"
edition = "2024"
description = "Servidor MCP (stdio) do atelier: dá aos agentes leitura e escrita na bancada aberta"

[[bin]]
name = "atelier-mcp"
path = "src/main.rs"

[dependencies]
atelier-core = { path = "../core" }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
