[package]
name = "atelier"
version = "0.2.4"
description = "atelier — gestão pessoal do Paulo"
authors = ["Paulo"]
edition = "2024"

[lib]
name = "atelier_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
atelier-core = { path = "../core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
# o ícone grande da janela (barra de tarefas) e as permissões do WebView2; nas mesmas versões que o Tauri já usa
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }
